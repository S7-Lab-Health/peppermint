# Deploy — S7-Lab-Health/peppermint fork
#
# Triggered on push to main.
# Builds the Docker image, pushes to ACR with SHA tag, then updates
# the production Container App to the new revision.
#
# Required GitHub configuration (Settings > Environments > "production"):
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables:
#     ACR_LOGIN_SERVER      — e.g. acraltairprod.azurecr.io
#     CONTAINER_APP_NAME    — e.g. ca-peppermint-production
#     RESOURCE_GROUP        — e.g. rg-altair-prod

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: peppermint

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to Tailnet for the pool journal
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
      - name: Set up shared ACR admission
        uses: S7-Lab-Health/altair-infra/.github/actions/acr-agentpool-scale-up@69dd37cc58fcf29f0e88aec3cd518289c800bfac
        with:
          operation: setup
          coordination-account: altairasprod
          coordination-container: acr-pool-coordination

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          ACR_LOGIN_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_LOGIN_SERVER%.azurecr.io}"
          IMAGE="${ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          python3 "$ACR_POOL_GUARD" build --registry "$ACR_NAME" \
            --key "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/image" --wait 1800 -- \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --file dockerfile \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Production ACA
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"
          echo "Deployed: ${{ needs.build.outputs.image }}"
