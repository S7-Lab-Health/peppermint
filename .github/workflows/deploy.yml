# Deploy — S7-Lab-Health/peppermint fork
#
# Triggered on push to main.
# Builds the Docker image, pushes to ACR with SHA tag, then updates
# the production Container App to the new revision.
#
# Required GitHub configuration (Settings > Environments > "production"):
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables:
#     ACR_LOGIN_SERVER      — e.g. acraltairprod.azurecr.io
#     CONTAINER_APP_NAME    — e.g. ca-peppermint-production
#     RESOURCE_GROUP        — e.g. rg-altair-prod

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: peppermint

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to Tailnet for the pool journal
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
      - name: Check private journal access
        run: |
          python3 - <<'PY'
          import hashlib
          import ipaddress
          import json
          import re
          import socket
          import subprocess
          host = 'altairasprod.blob.core.windows.net'
          addresses = {row[4][0] for row in socket.getaddrinfo(host, 443)}
          print('Journal DNS resolves privately:', all(ipaddress.ip_address(ip).is_private for ip in addresses), flush=True)
          def read(label, args):
              result = subprocess.run(['az', *args, '--only-show-errors', '-o', 'json'], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  codes = re.findall(r'\(([A-Za-z][A-Za-z0-9]+)\)|ErrorCode:([A-Za-z0-9]+)', result.stderr)
                  code = next((a or b for a, b in codes), 'unclassified')
                  raise SystemExit(label + ' failed: ' + code)
              print(label + ' passed', flush=True)
              return json.loads(result.stdout)
          registry = read('Registry read', ['acr', 'show', '--name', 'acraltairprod', '--query', 'id'])
          pool_id = registry + '/agentPools/agentpool-production'
          name = hashlib.sha256(pool_id.lower().encode()).hexdigest() + '.json'
          read('Journal metadata read', ['storage', 'blob', 'show', '--account-name', 'altairasprod', '--container-name', 'acr-pool-coordination', '--auth-mode', 'login', '--name', name, '--query', 'properties.lease.status'])
          PY

      - name: Verify and set up shared ACR admission
        # Public workflows cannot load a private repository action. This is an
        # exact, hash-verified export of the same policy, not a separate policy.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          folder = root / 'scripts/ci/vendor/acr_pool'
          manifest = json.loads((folder / 'upstream.json').read_text())
          policy = folder / 'pool.py'
          if hashlib.sha256(policy.read_bytes()).hexdigest() != manifest['sha256']:
              raise SystemExit('Shared ACR policy differs from its pinned export')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ACR_POOL_GUARD={policy}\n')
              output.write('ACR_REGISTRY=acraltairprod\n')
              output.write('ACR_AGENT_POOL=agentpool-production\n')
              output.write('ACR_COORDINATION_ACCOUNT=altairasprod\n')
              output.write('ACR_COORDINATION_CONTAINER=acr-pool-coordination\n')
          PY

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          ACR_LOGIN_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_LOGIN_SERVER%.azurecr.io}"
          IMAGE="${ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          python3 "$ACR_POOL_GUARD" build --registry "$ACR_NAME" \
            --key "${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/image" --wait 1800 -- \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --file dockerfile \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Production ACA
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"
          echo "Deployed: ${{ needs.build.outputs.image }}"
