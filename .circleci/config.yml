version: 2.1

# Manual release rehearsal only. No push/PR event enables this workflow.
parameters:
  run-peppermint-production:
    type: boolean
    default: false
  expected-release-sha:
    type: string
    default: ""

jobs:
  release-production:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      EXPECTED_RELEASE_SHA: << pipeline.parameters.expected-release-sha >>
    steps:
      - checkout
      - run:
          name: Run the existing Peppermint build and ACA update with the shared ACR guard
          command: bash scripts/ci/circleci-production-release.sh

workflows:
  production-release-rehearsal:
    when: << pipeline.parameters.run-peppermint-production >>
    jobs:
      - approve-production:
          type: approval
          filters:
            branches:
              only: main
      - release-production:
          context: altair-peppermint-production-release
          requires:
            - approve-production
          serial-group: altair-peppermint-production
          filters:
            branches:
              only: main
